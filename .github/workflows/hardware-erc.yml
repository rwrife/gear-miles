name: hardware-erc

on:
  pull_request:
    paths:
      - "hardware/kicad/**"
      - ".github/workflows/hardware-erc.yml"
  push:
    branches: [main]
    paths:
      - "hardware/kicad/**"
      - ".github/workflows/hardware-erc.yml"

permissions:
  contents: read

jobs:
  erc-and-pinmap:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/inti-cmnb/kicad9_auto@sha256:bc45a1ee6fd92f47c9dfc67cf226eb54f13b42c339a6be42faae32ab87a09673
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Regenerate schematic
        run: >-
          python3 hardware/kicad/tools/generate_schematic.py &&
          git diff --exit-code -- hardware/kicad/gear-miles.kicad_sch hardware/kicad/gear.kicad_sym
      - name: Run native ERC
        run: >-
          kicad-cli sch erc --exit-code-violations --format json
          -o hardware/kicad/reports/erc-ci.json
          hardware/kicad/gear-miles.kicad_sch
      - name: Assert exported pin map
        run: >-
          python3 hardware/kicad/tests/test_netlist.py &&
          python3 hardware/kicad/tests/test_schematic_bounds.py
      - name: Test blocker detector with synthetic fixtures
        run: python3 hardware/kicad/tests/test_blocker_gate.py
      - name: Check PDF text bounds
        run: >-
          kicad-cli sch export pdf -o /tmp/gear-miles.pdf hardware/kicad/gear-miles.kicad_sch &&
          python3 hardware/kicad/tests/test_pdf_bounds.py /tmp/gear-miles.pdf

  electrical-blockers:
    # Keep distinct from native ERC: this rejected draft MUST fail here.
    # Do not waive, skip draft PRs, or add continue-on-error to hide blockers.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/inti-cmnb/kicad9_auto@sha256:bc45a1ee6fd92f47c9dfc67cf226eb54f13b42c339a6be42faae32ab87a09673
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact source revision
        run: git rev-parse HEAD
      - name: Export current schematic (never trust committed stale netlist)
        run: >-
          kicad-cli sch export netlist --format kicadxml
          -o /tmp/blocker-input.net hardware/kicad/gear-miles.kicad_sch
      - name: Reject known electrical and metadata blockers
        run: >-
          python3 hardware/kicad/tools/check_blockers.py /tmp/blocker-input.net
          --output /tmp/electrical-blockers.json
      - name: Preserve blocker evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electrical-blockers
          path: |
            /tmp/blocker-input.net
            /tmp/electrical-blockers.json
