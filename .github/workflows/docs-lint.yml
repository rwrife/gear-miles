name: docs-lint

on:
  pull_request:
    paths:
      - "**.md"
  push:
    branches: [main]
    paths:
      - "**.md"

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.13.0 "**/*.md"
